name: DeepVoiceStudio
options:
  bundleIdPrefix: com.deepvoice
  deploymentTarget:
    iOS: "16.0"
targets:
  DeepVoiceStudio:
    type: application
    platform: iOS
    sources:
      - path: DeepVoiceStudio
        excludes:
          - Info.plist
    info:
      path: DeepVoiceStudio/Info.plist
      properties:
        CFBundleDisplayName: Deep Voice Studio
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: Deep Voice Studio uses the microphone so you can sing with effects, see your pitch and record your singing.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepvoice.singstudio
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
